# Builds the demo and publishes it to GitHub Pages as one artifact, a project page at
# https://lab.n8d.studio/pattern-dump-demo/ (the organisation's custom domain): the website (site/) at that path, and the style guide's own
# workbench (styleguide/) under styleguide/. `npm run pages` runs both builds, each for its address, and copies them
# together into _site/ (scripts/assemble-pages.mjs); it can be run locally the same way. The site's build checks
# every link, image and page for accessibility before it writes anything, the second time in Chromium (pd build
# --browser: contrast, phone and desktop sizes), so a broken page fails the run and nothing is deployed.
# Before the first run: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a deploy that has started is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history: a layout that shows page dates needs it, and pd build refuses a shallow clone then.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
      # The waves background (styleguide/media/images/waves*.svg) is generated from components/waves-art, its
      # styles and data/sunset-waves.json. Written again here, it must match what is committed: after a change to
      # any of those, run `npm run waves-svg` and commit the two files.
      - name: Generated waves artwork is up to date
        run: |
          npm run waves-svg
          git diff --exit-code -- styleguide/media/images/waves.svg styleguide/media/images/waves-fanned.svg
      - run: npx playwright install --with-deps chromium
      - run: npm run pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
